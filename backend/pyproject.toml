[project]
name = "litechat-backend"
version = "0.1.0"
description = "LiteChat support desk API (Litestar + SQLAlchemy)"
readme = "README.md"
authors = [
    { name = "BretRen", email = "bretren2013@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.1",
    "email-validator>=2.3.0",
    "httpx>=0.28.1",
    "litestar>=2.24.0",
    "pydantic>=2.13.5",
    "pyjwt>=2.14.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
    "websockets>=17.1",
]

[tool.uv]
# This is an application, not a distributable package: the code lives in `app/`
# and runs from source. Without this, uv builds and installs a package named
# after the project, and Nixpacks then infers `python -m <name>` as the start
# command instead of the one in nixpacks.toml.
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
