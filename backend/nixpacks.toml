# Nixpacks build description for the LiteChat backend.
#
# Dokploy's default build type is Nixpacks, so there is no Dockerfile to
# maintain: Nixpacks produces the image from this file plus the project
# metadata. Point Dokploy's "Base Directory" for this application at `backend`.

[phases.setup]
nixPkgs = ["python311", "uv"]

[phases.install]
# Split so the dependency layer is cached until pyproject.toml / uv.lock change.
cmds = [
    "uv sync --frozen --no-dev --no-install-project",
    "uv sync --frozen --no-dev",
]

[start]
# Applies migrations, then serves. `uv run` resolves the project virtualenv.
cmd = "sh start.sh"
