# Nixpacks build description for the LiteChat backend.
#
# Dokploy's default build type is Nixpacks, so there is no Dockerfile to
# maintain. Point Dokploy's "Base Directory" for this application at `backend`,
# and make sure the start command below actually wins — see DEPLOY.md, because
# Nixpacks otherwise infers its own start command for Python projects.

[phases.setup]
nixPkgs = ["python311", "uv"]

[phases.install]
# The project is a non-package application ([tool.uv] package = false), so this
# only installs dependencies. `--frozen` fails loudly if uv.lock is stale.
cmds = ["uv sync --frozen --no-dev"]

[start]
cmd = "sh start.sh"
