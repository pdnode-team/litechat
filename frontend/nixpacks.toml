# Nixpacks build description for the LiteChat frontend.
#
# Point Dokploy's "Base Directory" for this application at `frontend`, set the
# Build Type to Nixpacks, and set "Publish Directory" to `dist` so Dokploy serves
# the built SPA with its nginx image (which listens on port 80).
#
# The SPA talks to its own origin, so no build-time API URL is needed when
# /api and /ws are routed to the backend on the same domain.

[phases.setup]
# nodejs_24, not nodejs_22: rolldown (the bundler behind Vite 8) ships its native
# binaries as optional dependencies that declare `engines: >=22.12.0`, and
# nixpkgs' nodejs_22 resolves to 22.11.0. Optional dependencies whose engines do
# not match are skipped silently, which shows up much later as
# "Cannot find native binding".
nixPkgs = ["nodejs_24", "pnpm"]

[phases.install]
cmds = [
    # Start from an empty directory so nothing stale can survive a build cache.
    "rm -rf node_modules",
    # --prod=false is deliberate: the build script is `tsc -b && vite build`, and
    # both live in devDependencies.
    "pnpm install --frozen-lockfile --prod=false",
    # Diagnostics: these two lines make the next failure self-explanatory.
    "sh -c 'echo \"--- node ---\"; node -v; echo \"--- rolldown packages ---\"; ls node_modules/.pnpm | grep -i rolldown || echo NONE'",
]

[phases.build]
cmds = ["pnpm build"]
